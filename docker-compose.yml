services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=productsdb;Username=postgres;Password=postgres"
      Redis__ConnectionString: "redis:6379"
      # Set WEBHOOK_SECRET in a local .env file (never commit it). Empty = webhooks answer 503.
      Webhook__Secret: "${WEBHOOK_SECRET:-}"
      # Real-time notifications (Task 4). Put the values in a local .env file (never commit it).
      Jwt__Key: "${JWT_KEY:-}"
      Demo__Users__alice: "${DEMO_ALICE_PASSWORD:-}"
      Demo__Users__bob: "${DEMO_BOB_PASSWORD:-}"
      Notifications__SimulationKey: "${SIMULATION_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productsdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
